name: Build and Push with Semantic Release
on:
  push:
    branches: [ "main" ]

jobs:
  docker:
    runs-on: ubuntu-latest
    # Added explicit write permissions for the dry-run check
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      new_release_published: ${{ steps.semantic_dry_run.outputs.new_release_published }}
      new_release_version: ${{ steps.semantic_dry_run.outputs.new_release_version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Fetch all history for semantic-release to calculate version
          fetch-depth: 0

      - name: Semantic Release (Dry Run)
        id: semantic_dry_run
        uses: cycjimmy/semantic-release-action@v6.0.0
        with:
          dry_run: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push
        if: steps.semantic_dry_run.outputs.new_release_published == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/ci-toolbox:latest
            ${{ secrets.DOCKER_USERNAME }}/ci-toolbox:${{ steps.semantic_dry_run.outputs.new_release_version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    needs: docker
    if: needs.docker.outputs.new_release_published == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: Semantic Release (Actual Release)
        uses: cycjimmy/semantic-release-action@v6.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
