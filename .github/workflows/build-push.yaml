name: Build and Push with Semantic Release
on:
  push:
    branches: [ "main" ]

jobs:
  docker:
    runs-on: ubuntu-latest
    outputs:
      new_release_published: ${{ steps.semantic_dry_run.outputs.new_release_published }}
      new_release_version: ${{ steps.semantic_dry_run.outputs.new_release_version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Calculate the version but DO NOT release yet
      - name: Semantic Release (Dry Run)
        id: semantic_dry_run
        uses: cycjimmy/semantic-release-action@v4
        with:
          dry_run: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Push the image using the version calculated above
      - name: Build and push
        if: steps.semantic_dry_run.outputs.new_release_published == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/ci-toolbox:latest
            ${{ secrets.DOCKER_USERNAME }}/ci-toolbox:${{ steps.semantic_dry_run.outputs.new_release_version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    needs: docker
    if: needs.docker.outputs.new_release_published == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          
      # This now creates the actual GitHub Tag and Release
      - name: Semantic Release (Actual)
        uses: cycjimmy/semantic-release-action@v4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
